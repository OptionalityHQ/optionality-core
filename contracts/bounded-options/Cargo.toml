[package]
name = "bounded-options"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
# The money lives in one crate, compiled for both targets: the chain and the
# engine that quotes it. See docs/09-pool-architecture.md.
bounded-core = { path = "../../core" }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
