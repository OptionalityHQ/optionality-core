[package]
name = "chain-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The host signs real transactions inside a local sandbox, so it needs the same
# runtime the integration tests drive.
[dependencies]
anyhow = "1"
near-workspaces = "0.24.0"
serde_json = "1"
bounded-core = { path = "../../core" }
oracle-sources = { path = "../oracle-sources" }
ed25519-dalek = "2.2.0"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
