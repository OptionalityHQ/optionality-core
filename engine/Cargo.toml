[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The venue's decisions, with no I/O in the library: which series exist, what
# each is worth, what it costs to open and to close, and when a quote is worth
# re-sending. The float model and the integer money meet only here, so the
# number the screen shows is the number the contract charges.
[dependencies]
bounded-core = { path = "../core" }
surface = { path = "../surface" }
serde_json = "1"
# The sockets, in Rust. Sync tungstenite over the system TLS (Security.framework
# on macOS), because `native-tls` and `security-framework` are already built in
# this workspace for the chain client and no second crypto stack needs compiling.
tungstenite = { version = "0.24", features = ["native-tls"] }
